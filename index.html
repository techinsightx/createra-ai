<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Createra AI — Ultimate Multimodal Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- World-Class Markdown & Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-primary: #020617;
            --bg-secondary: #0f172a;
            --bg-sidebar: #020617;
            --bg-input: #1e293b;
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --error: #ef4444;
            --mic-active: #ef4444;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0; padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            /* 🌟 Animated Premium Background */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.08), transparent 40%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            animation: bgPulse 15s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% { background-position: 0% 0%, 100% 0%, 0 0, 0 0; }
            100% { background-position: 0% 10%, 100% 10%, 0 0, 0 0; }
        }

        /* 🌟 ANIMATED AI LOGO */
        .logo-animated {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--bg-secondary); display: flex;
            align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            border: 1px solid var(--border-color); flex-shrink: 0;
        }
        .logo-animated::before {
            content: ''; position: absolute; width: 150%; height: 150%;
            background: conic-gradient(from 0deg, transparent, var(--accent-primary), var(--accent-secondary), transparent);
            animation: spin 4s linear infinite;
        }
        .logo-animated::after {
            content: 'C'; position: absolute; width: 32px; height: 32px;
            background: var(--bg-primary); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.2rem; color: white; z-index: 2;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px; background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
        .logo-text { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
        
        .new-chat-btn {
            margin: 16px; padding: 12px; background: var(--accent-gradient); color: white; border: none;
            border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        .new-chat-btn:active { transform: scale(0.98); }
        
        .chat-history { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
        .chat-history-item {
            padding: 12px; border-radius: 8px; cursor: pointer; color: var(--text-secondary);
            font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: all 0.2s; margin-bottom: 4px; display: flex; align-items: center; gap: 10px;
        }
        .chat-history-item:active { background: rgba(255,255,255,0.05); }
        .chat-history-item.active { background: rgba(139, 92, 246, 0.15); color: var(--accent-primary); border: 1px solid rgba(139, 92, 246, 0.2); }
        
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border-color); }
        .user-info {
            display: none; align-items: center; gap: 10px; padding: 10px; background: var(--bg-secondary);
            border-radius: 10px; cursor: pointer; border: 1px solid var(--border-color);
        }
        .user-avatar {
            width: 32px; height: 32px; background: var(--accent-gradient); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; color: white;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content { 
            flex: 1; display: flex; flex-direction: column; 
            height: 100%; height: 100dvh; overflow: hidden; position: relative; 
        }
        .top-bar {
            padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex;
            justify-content: space-between; align-items: center; background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(12px); flex-shrink: 0;
        }
        .menu-toggle { display: none; background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; padding: 4px; }
        .top-bar-title { font-size: 1rem; font-weight: 600; color: var(--text-secondary); }

        /* ===== CHAT AREA & WELCOME SCREEN ===== */
        .chat-area {
            flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column;
            gap: 20px; scroll-behavior: smooth; min-height: 0;
            -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
        }
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .welcome-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px 20px; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .welcome-screen .logo-animated { width: 64px; height: 64px; margin-bottom: 24px; }
        .welcome-screen .logo-animated::after { width: 52px; height: 52px; font-size: 1.8rem; }
        .welcome-screen h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome-screen p { color: var(--text-secondary); margin-bottom: 32px; max-width: 500px; line-height: 1.6; }
        
        .suggestion-chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 600px; }
        .chip {
            padding: 12px 20px; background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-primary); font-size: 0.9rem; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px; text-align: left;
        }
        .chip:hover { border-color: var(--accent-primary); background: rgba(139, 92, 246, 0.1); transform: translateY(-2px); }
        .chip:active { transform: scale(0.98); }

        .message {
            max-width: 85%; padding: 16px 20px; border-radius: 16px; line-height: 1.6;
            font-size: 0.95rem; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .message.user {
            align-self: flex-end; background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.05));
            border: 1px solid rgba(139, 92, 246, 0.3); border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start; background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .message .label {
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px; color: var(--accent-secondary); display: flex; align-items: center; gap: 6px;
        }
        .message.user .label { color: #a78bfa; justify-content: flex-end; }

        .message img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border-color); }
        .message .attachment-preview {
            display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05);
            padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.85rem; color: var(--text-secondary);
        }

        /* ===== MESSAGE ACTIONS (Copy & Speak) ===== */
        .message-actions {
            display: flex; gap: 8px; margin-top: 12px; padding-top: 12px;
            border-top: 1px solid var(--border-color); opacity: 0; transition: opacity 0.2s;
        }
        .message.ai:hover .message-actions { opacity: 1; }
        .action-icon-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);
            padding: 6px; border-radius: 6px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: all 0.2s;
        }
        .action-icon-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); border-color: rgba(255,255,255,0.2); }
        .action-icon-btn.speaking { color: var(--accent-primary); border-color: var(--accent-primary); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* ===== MARKDOWN & TYPEWRITER ===== */
        .markdown-body { font-size: 0.95rem; line-height: 1.7; color: var(--text-primary); word-wrap: break-word; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 16px; margin-bottom: 8px; font-weight: 700; color: var(--accent-secondary); }
        .markdown-body ul, .markdown-body ol { margin-left: 20px; margin-bottom: 12px; }
        .markdown-body p { margin-bottom: 12px; }
        
        .markdown-body pre {
            background: #0d1117; border: 1px solid var(--border-color); border-radius: 8px;
            margin: 12px 0; overflow: hidden;
        }
        .code-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #161b22; padding: 8px 12px; border-bottom: 1px solid var(--border-color);
            font-size: 0.75rem; color: var(--text-secondary); font-family: monospace;
        }
        .code-copy-btn {
            background: rgba(255,255,255,0.1); border: none; color: var(--text-secondary);
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;
            transition: all 0.2s; display: flex; align-items: center; gap: 4px;
        }
        .code-copy-btn:active { background: rgba(255,255,255,0.2); }
        .markdown-body pre code {
            display: block; padding: 12px; overflow-x: auto; background: transparent !important;
            font-family: 'Fira Code', 'Consolas', monospace; font-size: 0.85rem;
        }
        .markdown-body code {
            font-family: 'Fira Code', 'Consolas', monospace; font-size: 0.85rem;
            background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px;
        }

        /* 🌟 Blinking Cursor for Typewriter */
        .markdown-body.typing::after {
            content: '▋'; display: inline-block; color: var(--accent-primary);
            animation: blink 1s step-end infinite; margin-left: 2px; vertical-align: middle;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ===== INPUT COMMAND CENTER ===== */
        .input-container { 
            flex-shrink: 0; padding: 16px 24px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom)); 
            background: var(--bg-primary); border-top: 1px solid var(--border-color);
        }
        .input-island {
            background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 20px;
            padding: 12px; transition: all 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative;
        }
        .input-island:focus-within {
            border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15), 0 10px 30px rgba(0,0,0,0.3);
        }

        .options-row { display: flex; gap: 8px; margin-bottom: 10px; padding: 0 4px; }
        .options-row select {
            padding: 8px 10px; background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-secondary); font-size: 16px;
            cursor: pointer; font-family: inherit; flex: 1;
        }
        .options-row select:focus { outline: none; border-color: var(--accent-primary); color: white; }

        .input-box { display: flex; align-items: flex-end; gap: 10px; }
        .action-btn {
            width: 40px; height: 40px; background: transparent; border: 1px solid var(--border-color);
            border-radius: 10px; color: var(--text-secondary); cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
        }
        .action-btn:active { background: rgba(255,255,255,0.1); }
        .action-btn svg { width: 20px; height: 20px; }

        .mic-btn { position: relative; }
        .mic-btn.listening {
            background: rgba(239, 68, 68, 0.1); border-color: var(--mic-active); color: var(--mic-active);
            animation: pulse-mic 1.5s infinite;
        }
        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .input-box textarea {
            flex: 1; background: transparent; border: none; color: var(--text-primary); 
            font-size: 16px; font-family: inherit; resize: none; max-height: 120px; padding: 10px 0; line-height: 1.5;
        }
        .input-box textarea:focus { outline: none; }
        .input-box textarea::placeholder { color: #64748b; }

        .send-btn, .stop-btn {
            width: 40px; height: 40px; border: none; border-radius: 10px; color: white;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .send-btn { background: var(--accent-gradient); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .stop-btn { background: var(--error); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); display: none; }
        .stop-btn:active { transform: scale(0.95); }

        .listening-pill {
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--mic-active); padding: 6px 16px; border-radius: 20px; font-size: 0.8rem;
            font-weight: 600; display: none; align-items: center; gap: 8px; backdrop-filter: blur(8px);
            animation: slideDown 0.3s ease; white-space: nowrap;
        }
        .listening-pill.active { display: flex; }
        @keyframes slideDown { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .listening-dot { width: 8px; height: 8px; background: var(--mic-active); border-radius: 50%; animation: blink 1s infinite; }

        .file-preview-bar {
            display: none; padding: 8px 12px; background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 8px; margin-bottom: 10px;
            align-items: center; justify-content: space-between; font-size: 0.85rem; color: #a78bfa;
        }
        .file-preview-bar.active { display: flex; }
        .remove-file { cursor: pointer; color: var(--error); font-weight: bold; padding: 0 5px; }

        .typing-dots { display: flex; gap: 4px; padding: 8px 0; align-items: center; }
        .typing-dots span {
            width: 8px; height: 8px; background: var(--accent-secondary);
            border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* ===== MODAL & TOAST ===== */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            padding: 32px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal h2 { margin-bottom: 20px; font-size: 1.5rem; }
        .modal input {
            width: 100%; padding: 14px; margin: 10px 0; background: var(--bg-primary);
            border: 1px solid var(--border-color); border-radius: 10px; color: white; font-family: inherit; font-size: 16px;
        }
        .modal input:focus { outline: none; border-color: var(--accent-primary); }
        .modal button {
            width: 100%; padding: 14px; background: var(--accent-gradient); border: none;
            border-radius: 10px; color: white; font-weight: 700; cursor: pointer; margin-top: 10px; font-family: inherit; font-size: 16px;
        }
        .auth-error { color: var(--error); font-size: 0.85rem; margin-top: 10px; }

        .toast {
            position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            padding: 12px 24px; border-radius: 10px; z-index: 2000; transition: 0.3s;
            font-size: 0.9rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--error); color: var(--error); }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 49;
            opacity: 0; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        @media (max-width: 768px) {
            .sidebar { 
                position: fixed; top: 0; left: 0; width: 85%; max-width: 300px;
                height: 100%; height: 100dvh; transform: translateX(-100%); 
                box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 50;
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            .message { max-width: 92%; padding: 14px 16px; font-size: 0.9rem; }
            .input-container { padding: 12px 16px; }
            .chat-area { padding: 16px; }
            .options-row { gap: 6px; }
            .top-bar { padding: 12px 16px; }
            .message-actions { opacity: 1; } /* Always show actions on mobile */
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-animated"></div>
            <div class="logo-text">Createra AI</div>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            New Chat
        </button>
        <div class="chat-history" id="chatHistoryList"></div>
        <div class="sidebar-footer">
            <div class="user-info" id="userInfo" onclick="logout()">
                <div class="user-avatar" id="userAvatar">U</div>
                <div style="flex:1; text-align: left;">
                    <div style="font-weight: 600; font-size: 0.85rem;" id="userName">User</div>
                    <div style="font-size: 0.7rem; color: var(--text-secondary);">Click to Logout</div>
                </div>
            </div>
            <button class="new-chat-btn" id="loginBtnSidebar" onclick="openModal('login')" style="background: var(--bg-secondary); border: 1px solid var(--border-color); box-shadow: none; margin: 0; color: var(--text-primary);">
                Log In / Sign Up
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
            <div class="top-bar-title">Createra AI</div>
            <div style="width: 24px;"></div>
        </div>

        <div class="chat-area" id="chatArea">
            <!-- Welcome Screen (Shown when chat is empty) -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="logo-animated"></div>
                <h2>Welcome to Createra AI</h2>
                <p>Your world-class multimodal assistant. I can write scripts, generate images, analyze PDFs, and even listen to your voice. What will we create today?</p>
                <div class="suggestion-chips">
                    <button class="chip" onclick="useSuggestion('Write a 60-second viral reel script about AI')">🎥 Viral Reel Script</button>
                    <button class="chip" onclick="useSuggestion('Generate an image of a futuristic Indian city at night')">🎨 Futuristic City Image</button>
                    <button class="chip" onclick="useSuggestion('Explain quantum computing like I am 5 years old')">🧠 Explain Complex Topic</button>
                    <button class="chip" onclick="useSuggestion('Write a professional email to a client about a project delay')">💼 Professional Email</button>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="file-preview-bar" id="filePreviewBar">
                <span id="fileName">📎 file.pdf</span>
                <span class="remove-file" onclick="clearFile()">✕</span>
            </div>
            
            <div class="input-island">
                <div class="listening-pill" id="listeningPill">
                    <div class="listening-dot"></div>
                    Listening...
                </div>

                <div class="options-row">
                    <select id="audience">
                        <option value="general">🎯 General</option>
                        <option value="students">🎓 Students</option>
                        <option value="creators">🎬 Creators</option>
                        <option value="business">💼 Business</option>
                    </select>
                    <select id="format">
                        <option value="detailed_script">📝 Script</option>
                        <option value="reel_script">🎥 Reel</option>
                        <option value="blog_post">📰 Blog</option>
                        <option value="image_gen">🎨 Image</option>
                    </select>
                </div>

                <div class="input-box">
                    <input type="file" id="fileInput" hidden accept="image/*,.pdf" onchange="handleFileSelect(event)">
                    <button class="action-btn" onclick="document.getElementById('fileInput').click()" title="Attach">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    
                    <textarea id="userInput" rows="1" placeholder="Message Createra AI..." oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
                    
                    <button class="action-btn mic-btn" id="micBtn" onclick="toggleMic()" title="Voice Input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    </button>

                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                    <button class="stop-btn" id="stopBtn" onclick="stopGeneration()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- AUTH MODAL -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h2 id="modalTitle">Welcome to Createra</h2>
            <input type="email" id="authEmail" placeholder="Email Address">
            <input type="password" id="authPassword" placeholder="Password">
            <button onclick="handleAuth()" id="authSubmitBtn">Log In</button>
            <p style="margin-top: 15px; font-size: 0.85rem; color: var(--text-secondary);">
                <span id="switchText">No account? <span style="color: var(--accent-secondary); cursor: pointer;" onclick="toggleAuthMode()">Sign Up</span></span>
            </p>
            <p class="auth-error" id="authError"></p>
            <button onclick="closeModal()" style="background: transparent; border: 1px solid var(--border-color); margin-top: 10px; color: var(--text-secondary);">Cancel</button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCO3UoKy32ObYBRWUAWnixv1Wd57fstKt4",
            authDomain: "createra-ai.firebaseapp.com",
            projectId: "createra-ai",
            storageBucket: "createra-ai.firebasestorage.app",
            messagingSenderId: "243520774125",
            appId: "1:243520774125:web:d14a5384bcf6bb504e51e4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        let currentUser = null;
        let currentUserToken = null;
        let currentChatId = 'default';
        let attachedFile = null;
        let isLoginMode = true;
        let currentAbortController = null;

        // ===== SPEECH RECOGNITION =====
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-IN';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('listeningPill').classList.add('active');
            };
            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('listeningPill').classList.remove('active');
            };
            recognition.onerror = () => { if(isListening) recognition.stop(); };
            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                }
                if (finalTranscript) {
                    const textarea = document.getElementById('userInput');
                    textarea.value += (textarea.value.length > 0 ? ' ' : '') + finalTranscript;
                    autoResize(textarea);
                }
            };
        } else {
            document.getElementById('micBtn').style.display = 'none';
        }

        window.toggleMic = () => {
            if (!recognition) { showToast('Voice input not supported.', 'error'); return; }
            isListening ? recognition.stop() : recognition.start();
        };

        // ===== CHAT HISTORY =====
        const getChats = () => JSON.parse(localStorage.getItem(`createra_chats_${currentUser?.uid || 'guest'}`) || '{}');
        const saveChats = (chats) => localStorage.setItem(`createra_chats_${currentUser?.uid || 'guest'}`, JSON.stringify(chats));
        
        function loadChatHistoryUI() {
            const chats = getChats();
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = '';
            Object.keys(chats).reverse().forEach(id => {
                const div = document.createElement('div');
                div.className = `chat-history-item ${id === currentChatId ? 'active' : ''}`;
                div.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> ${chats[id].title || 'New Chat'}`;
                div.onclick = () => loadChat(id);
                list.appendChild(div);
            });
        }

        window.startNewChat = () => {
            currentChatId = 'chat_' + Date.now();
            const area = document.getElementById('chatArea');
            area.innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="logo-animated"></div>
                    <h2>Welcome to Createra AI</h2>
                    <p>Your world-class multimodal assistant. What will we create today?</p>
                    <div class="suggestion-chips">
                        <button class="chip" onclick="useSuggestion('Write a 60-second viral reel script about AI')">🎥 Viral Reel Script</button>
                        <button class="chip" onclick="useSuggestion('Generate an image of a futuristic Indian city at night')">🎨 Futuristic City Image</button>
                        <button class="chip" onclick="useSuggestion('Explain quantum computing like I am 5 years old')">🧠 Explain Complex Topic</button>
                    </div>
                </div>`;
            loadChatHistoryUI();
            if(window.innerWidth <= 768) toggleSidebar();
        };

        function loadChat(id) {
            currentChatId = id;
            const chats = getChats();
            const chat = chats[id];
            const area = document.getElementById('chatArea');
            area.innerHTML = ''; // Clear welcome screen
            if (chat && chat.messages) {
                chat.messages.forEach(msg => renderMessage(msg.text, msg.type, msg.attachment, false));
            } else {
                startNewChat();
                return;
            }
            loadChatHistoryUI();
            if(window.innerWidth <= 768) toggleSidebar();
        }

        function saveMessageToHistory(text, type, attachment = null) {
            const chats = getChats();
            if (!chats[currentChatId]) chats[currentChatId] = { title: text.substring(0, 30) + '...', messages: [] };
            chats[currentChatId].messages.push({ text, type, attachment });
            saveChats(chats);
            loadChatHistoryUI();
        }

        // ===== AUTH LOGIC =====
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                user.getIdToken().then(token => { currentUserToken = token; });
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('loginBtnSidebar').style.display = 'none';
                document.getElementById('userName').innerText = user.email.split('@')[0];
                document.getElementById('userAvatar').innerText = user.email[0].toUpperCase();
                closeModal();
                showToast('Welcome back!', 'success');
                startNewChat();
            } else {
                document.getElementById('userInfo').style.display = 'none';
                document.getElementById('loginBtnSidebar').style.display = 'block';
                currentUserToken = null;
                currentChatId = 'guest_' + Date.now();
            }
        });

        window.openModal = (mode) => { document.getElementById('authModal').classList.add('active'); toggleAuthMode(mode === 'signup'); };
        window.closeModal = () => { document.getElementById('authModal').classList.remove('active'); document.getElementById('authError').innerText = ''; };
        window.toggleAuthMode = (forceSignup) => {
            isLoginMode = !forceSignup;
            document.getElementById('modalTitle').innerText = isLoginMode ? 'Welcome Back' : 'Create Account';
            document.getElementById('authSubmitBtn').innerText = isLoginMode ? 'Log In' : 'Sign Up Free';
            document.getElementById('switchText').innerHTML = isLoginMode ? 'No account? <span style="color:var(--accent-secondary);cursor:pointer" onclick="toggleAuthMode(true)">Sign Up</span>' : 'Have an account? <span style="color:var(--accent-secondary);cursor:pointer" onclick="toggleAuthMode(false)">Log In</span>';
        };

        window.handleAuth = async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            try {
                if (isLoginMode) await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
            } catch (e) {
                let msg = e.message.replace('Firebase: ', '');
                if(msg.includes('invalid-credential')) msg = 'Incorrect email or password.';
                document.getElementById('authError').innerText = msg;
            }
        };

        window.logout = async () => { await signOut(auth); showToast('Logged out', 'success'); };

        // ===== FILE & INPUT HANDLING =====
        window.handleFileSelect = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                attachedFile = { name: file.name, type: file.type, base64: e.target.result };
                document.getElementById('fileName').innerText = `📎 ${file.name}`;
                document.getElementById('filePreviewBar').classList.add('active');
            };
            reader.readAsDataURL(file);
        };

        window.clearFile = () => {
            attachedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreviewBar').classList.remove('active');
        };

        window.autoResize = (textarea) => {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        };

        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        };

        window.useSuggestion = (text) => {
            document.getElementById('userInput').value = text;
            autoResize(document.getElementById('userInput'));
            sendMessage();
        };

        // ===== MESSAGE RENDERING & TYPEWRITER EFFECT =====
        function renderMessage(text, type, attachment = null, animate = true) {
            // Hide welcome screen if it exists
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.style.display = 'none';

            const area = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            let content = `<div class="label">${type === 'user' ? 'YOU' : '⚡ CREATERA AI'}</div>`;
            if (attachment) {
                if (attachment.type.startsWith('image/')) content += `<img src="${attachment.base64}" alt="Attachment">`;
                else content += `<div class="attachment-preview">📄 ${attachment.name}</div>`;
            }
            
            if (type === 'ai') {
                if (text.startsWith('http') && (text.includes('.jpg') || text.includes('.png') || text.includes('pollinations'))) {
                    content += `<img src="${text}" alt="Generated Image" style="max-width: 100%; border-radius: 12px; margin-top: 10px;">`;
                    content += `<div style="margin-top:8px; font-size:0.85rem; color:var(--text-secondary)">✨ Image generated! Long-press to save.</div>`;
                    div.innerHTML = content;
                    area.appendChild(div);
                } else {
                    content += `<div class="markdown-body ${animate ? 'typing' : ''}"></div>`;
                    content += `
                        <div class="message-actions">
                            <button class="action-icon-btn" onclick="copyToClipboard(this, \`${encodeURIComponent(text)}\`)" title="Copy">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                            </button>
                            <button class="action-icon-btn" onclick="speakMessage(this)" title="Read Aloud">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                            </button
                        </div>`;
                    div.innerHTML = content;
                    area.appendChild(div);
                    
                    if (animate) {
                        typeWriterEffect(div.querySelector('.markdown-body'), text);
                    } else {
                        const mdDiv = div.querySelector('.markdown-body');
                        mdDiv.classList.remove('typing');
                        mdDiv.innerHTML = marked.parse(text);
                        addCopyButtons(div);
                    }
                }
            } else {
                content += `<div class="markdown-body">${text.replace(/\n/g, '<br>')}</div>`;
                div.innerHTML = content;
                area.appendChild(div);
            }
            
            area.scrollTop = area.scrollHeight;
        }

        function typeWriterEffect(markdownDiv, fullText, speed = 15) {
            let i = 0;
            const chunkSize = 4;
            
            function type() {
                if (i < fullText.length) {
                    const currentText = fullText.substring(0, i + chunkSize);
                    markdownDiv.innerHTML = marked.parse(currentText);
                    
                    markdownDiv.querySelectorAll('pre code').forEach((block) => {
                        if (!block.dataset.highlighted) {
                            hljs.highlightElement(block);
                            block.dataset.highlighted = "yes";
                        }
                    });
                    
                    const chatArea = document.getElementById('chatArea');
                    chatArea.scrollTop = chatArea.scrollHeight;
                    
                    i += chunkSize;
                    setTimeout(type, speed);
                } else {
                    markdownDiv.classList.remove('typing');
                    markdownDiv.innerHTML = marked.parse(fullText);
                    addCopyButtons(markdownDiv.parentElement);
                    
                    const chatArea = document.getElementById('chatArea');
                    chatArea.scrollTop = chatArea.scrollHeight;
                }
            }
            type();
        }

        function addCopyButtons(messageDiv) {
            messageDiv.querySelectorAll('pre').forEach((pre) => {
                const code = pre.querySelector('code');
                if (code && !pre.querySelector('.code-header')) {
                    hljs.highlightElement(code);
                    const lang = code.className.replace('language-', '') || 'code';
                    const header = document.createElement('div');
                    header.className = 'code-header';
                    header.innerHTML = `<span>${lang}</span><button class="code-copy-btn" onclick="copyCodeToClipboard(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy</button>`;
                    pre.insertBefore(header, pre.firstChild);
                }
            });
        }

        window.copyToClipboard = (btn, encodedText) => {
            navigator.clipboard.writeText(decodeURIComponent(encodedText)).then(() => {
                showToast('Copied to clipboard!', 'success');
            });
        };

        window.copyCodeToClipboard = (btn) => {
            const code = btn.closest('pre').querySelector('code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '✅ Copied!';
                showToast('Code copied!', 'success');
                setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
            });
        };

        window.speakMessage = (btn) => {
            const text = btn.closest('.message').querySelector('.markdown-body').innerText;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            
            btn.classList.add('speaking');
            utterance.onend = () => btn.classList.remove('speaking');
            utterance.onerror = () => btn.classList.remove('speaking');
            
            window.speechSynthesis.speak(utterance);
        };

        // ===== CORE AI LOGIC =====
        window.sendMessage = async () => {
            const input = document.getElementById('userInput');
            const idea = input.value.trim();
            if (!idea && !attachedFile) return;

            if (!currentUserToken) {
                showToast('🔒 Please log in first', 'error');
                openModal('login');
                return;
            }

            if(isListening && recognition) recognition.stop();

            renderMessage(idea, 'user', attachedFile, false);
            saveMessageToHistory(idea, 'user', attachedFile);
            
            input.value = '';
            input.style.height = 'auto';
            const fileToSend = attachedFile;
            clearFile();
            
            document.getElementById('sendBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
            
            const area = document.getElementById('chatArea');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `<div class="label">⚡ CREATERA AI</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
            area.appendChild(typingDiv);
            area.scrollTop = area.scrollHeight;

            try {
                currentAbortController = new AbortController();
                const payload = {
                    user_idea: idea,
                    target_audience: document.getElementById('audience').value,
                    output_format: document.getElementById('format').value,
                    attachment: fileToSend ? { name: fileToSend.name, type: fileToSend.type, base64: fileToSend.base64 } : null
                };

                const response = await fetch('https://createra-ai.onrender.com/api/v1/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUserToken}` },
                    body: JSON.stringify(payload),
                    signal: currentAbortController.signal
                });

                const data = await response.json().catch(() => ({ detail: 'Server error' }));
                document.getElementById('typingIndicator')?.remove();

                if (!response.ok) {
                    renderMessage(`⚠️ Error: ${data.detail || data.message || 'Server Error'}`, 'ai', null, false);
                } else if (data.status === 'limit_reached') {
                    renderMessage(data.message, 'ai', null, false);
                    showToast('Free limit reached!', 'error');
                } else if (data.result) {
                    renderMessage(data.result, 'ai', null, true);
                    saveMessageToHistory(data.result, 'ai');
                }
            } catch (error) {
                document.getElementById('typingIndicator')?.remove();
                if (error.name === 'AbortError') renderMessage('⏹️ Generation stopped.', 'ai', null, false);
                else renderMessage('⚠️ Network error. Check connection.', 'ai', null, false);
            } finally {
                currentAbortController = null;
                document.getElementById('sendBtn').style.display = 'flex';
                document.getElementById('stopBtn').style.display = 'none';
                input.focus();
            }
        };

        window.stopGeneration = () => {
            if (currentAbortController) currentAbortController.abort();
        };

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
